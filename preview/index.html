<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142629" />
    <meta
      name="description"
      content="從朱砂渡出發，選擇信仰，沿古道尋回日輪聖火。"
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/journey.css" />
    <title>神燼：日輪朝聖記</title>
  </head>
  <body>
    <main id="app">
      <canvas
        id="world"
        tabindex="0"
        aria-label="日輪古道 3D 戰鬥場景"
      ></canvas>
      <div class="vignette"></div>
      <div id="hurt-flash" aria-hidden="true"></div>
      <header class="brand">
        <span class="sigil">◇</span>
        <div><strong>神燼</strong><small>日輪朝聖記</small></div>
      </header>
      <div class="chapter" hidden><strong id="region"></strong></div>
      <section id="intro" aria-label="朝聖行旅">
        <div class="journey-sheet">
          <h1>日輪朝聖記</h1>
          <p id="story">河上的最後一艘渡船，還在等它的銅鈴。</p>
          <fieldset id="faiths"><legend>選擇你的信仰</legend></fieldset>
          <p id="gift-note"></p>
          <nav id="route" aria-label="行旅地點"></nav>
          <p id="brief"></p>
          <button id="start" class="primary" disabled>準備渡口中…</button>
          <a class="war-link" href="./war.html">加入多人主神戰</a>
          <small id="load-status" role="status">載入場景與角色</small>
        </div>
      </section>
      <section id="hud" hidden aria-label="戰鬥狀態">
        <div class="vitals">
          <div class="vitals-head">
            <span id="oath-name">燼誓　破陣</span
            ><span id="hp-text">100 / 100</span>
          </div>
          <div class="bar hp"><i id="hp-bar"></i></div>
          <div class="bar stamina"><i id="stamina-bar"></i></div>
          <div class="aspect-label">
            <span>神相</span><span id="aspect-text">100%</span>
          </div>
          <div class="bar aspect"><i id="aspect-bar"></i></div>
        </div>
        <div class="boss-vitals">
          <small id="boss-phase">神殿鎮守　第一相</small
          ><strong id="enemy"></strong>
          <div class="bar boss"><i id="boss-bar"></i></div>
          <span id="boss-action">靠近守衛，尋找破綻</span>
        </div>
        <div class="objective">
          <span>試煉目標</span><strong id="task">擊敗神殿守衛</strong
          ><small>離開紅色圓陣，趁收招時反擊。</small>
        </div>
        <div class="actions">
          <button id="attack"><b>╱</b><span>長槍突刺</span><kbd>J</kbd></button
          ><button id="dodge">
            <b>彡</b><span>疾步閃避</span><kbd>SPACE</kbd></button
          ><button id="aspect"><b>✧</b><span>神相降臨</span><kbd>Q</kbd></button
          ><button id="oath"><b>◇</b><span>信仰神技</span><kbd>E</kbd></button>
        </div>
        <div class="movement-note">
          <kbd>WASD</kbd> 或點地移動　滑鼠右鍵拖曳視角　<kbd>ESC</kbd>
          暫停
        </div>
        <div id="combat-message" role="status"></div>
      </section>
      <nav class="utilities" aria-label="遊戲設定">
        <button id="motion" aria-pressed="true">震動：開</button>
        <button id="sound" aria-pressed="false">音效：關</button
        ><button id="pause" hidden>暫停</button>
      </nav>
      <section
        id="pause-panel"
        class="panel modal"
        hidden
        aria-label="暫停選單"
      >
        <h2>誓言，稍候。</h2>
        <p>
          WASD 移動　J 或點近身敵人攻擊　空白鍵閃避<br />Q 神相　E 信仰神技
          右鍵拖曳視角
        </p>
        <button id="resume" class="primary">繼續試煉</button
        ><button id="restart-pause" class="secondary">重新挑戰</button
        ><button id="retreat" class="secondary">返回行旅</button>
      </section>
      <section id="result" class="panel modal" hidden aria-label="試煉結果">
        <h2 id="result-title">誓衛已沉眠</h2>
        <p id="result-copy"></p>
        <button id="restart" class="primary">返回行旅</button>
      </section>
      <noscript>請啟用 JavaScript 進行遊戲。</noscript>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
