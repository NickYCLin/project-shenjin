name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run validate:assets
      - run: npm run build
      - name: Validate Python syntax without running Blender or Unreal
        run: python3 -m compileall -q tools/blender unreal/Scripts
# This workflow does not compile or test Unreal Engine. See unreal/README.md.
